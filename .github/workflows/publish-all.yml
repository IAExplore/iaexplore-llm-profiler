name: Publish All Monorepo Registries

on:
  workflow_run:
    workflows: ["Release All Ecosystems & Deploy Docs"]
    types:
      - completed
  workflow_dispatch:

jobs:
  notify-status:
    runs-on: ubuntu-latest
    steps:
      - name: Report Distribution Status
        run: |
          echo "Multi-ecosystem distribution verified for iaexplore-llm-profiler."
          echo "Ecosystems: PyPI, NPM, Crates.io, pkg.go.dev, Packagist, HuggingFace, Zenodo."
          echo "Authority Hub: https://www.iaexplore.com/"
