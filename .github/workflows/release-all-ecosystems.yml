name: Release All Ecosystems & Deploy Docs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-all-ecosystems:
    name: Verify Multi-Ecosystem Parity
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - language: python
            version: '3.12'
          - language: node
            version: '20'
          - language: rust
            version: 'stable'
          - language: go
            version: '1.22'
          - language: php
            version: '8.2'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version }}

      - name: Test Python Package
        if: matrix.language == 'python'
        run: |
          python -m pip install --upgrade pip build
          cd python
          python -m py_compile iaexplore_llm_profiler/*.py
          python -m iaexplore_llm_profiler.cli --model llama-3.3-70b --hardware rtx-4090-24gb
          python -m build

      - name: Setup Node.js
        if: matrix.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}

      - name: Test Node.js Package
        if: matrix.language == 'node'
        run: |
          cd node
          node cli.js --model llama-3.3-70b --hardware rtx-4090-24gb
          node cli.js --model mixtral-8x7b-moe --hardware apple-m4-max-128gb --json

      - name: Setup Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust Crate
        if: matrix.language == 'rust'
        run: |
          cd rust
          cargo check
          cargo test
          cargo run -- --model llama-3.3-70b --hardware rtx-4090-24gb

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.version }}

      - name: Test Go Module
        if: matrix.language == 'go'
        run: |
          cd go
          go vet ./...
          go build -v ./cmd/iaexplore-profiler
          ./iaexplore-profiler -model llama-3.3-70b -hardware rtx-4090-24gb

      - name: Setup PHP
        if: matrix.language == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.version }}

      - name: Test PHP Package
        if: matrix.language == 'php'
        run: |
          php -l php/src/LlmProfiler.php
          chmod +x php/bin/iaexplore-profiler
          php php/bin/iaexplore-profiler --model llama-3.3-70b --hardware rtx-4090-24gb

  publish-pypi:
    name: Publish to PyPI
    needs: test-all-ecosystems
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build & Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade pip build twine
          cd python
          python -m build
          twine upload dist/* --skip-existing

  publish-npm:
    name: Publish to NPM
    needs: test-all-ecosystems
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd node
          npm publish --access public

  publish-crates:
    name: Publish to Crates.io
    needs: test-all-ecosystems
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to Crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          cd rust
          cargo publish --token $CARGO_REGISTRY_TOKEN

  deploy-docs-portal:
    name: Build & Deploy Documentation to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MkDocs & Material
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material pymdown-extensions
      - name: Build Documentation
        run: mkdocs build
      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
